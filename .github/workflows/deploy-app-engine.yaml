name: Deploy to GCP App Engine

on:
  push:
  pull_request:

concurrency:
  group: "ae"
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read  # checkout
    strategy:
      matrix:
        node-version: [latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: yarn --frozen-lockfile
      - name: Build
        run: npm test
      - name: Generate deployment package
        run: zip -r deploy.zip . -x '*.git'
      - name: Upload deployment package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-engine
          path: deploy.zip

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: gcp-app-engine
      url: https://descent.live
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Download deployment package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-engine
      - name: Unzip deployment package
        run: unzip deploy.zip
      - name: Cleanup build files
        run: rm -rf deploy.zip .git
      - name: Deploy to GCP App Engine
        uses: google-github-actions/deploy-appengine@54d5fc7167ec790eb0233905e3cef384221b4619 # v3.0.1
        with:
          version: main
          env_vars: |-
            HUE_CLIENT=${{ vars.HUE_CLIENT }}
            HUE_ID=${{ vars.HUE_ID }}
            HUE_SECRET=${{ secrets.HUE_SECRET }}
            LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}
            LASTFM_POLL_INTERVAL=${{ vars.LASTFM_POLL_INTERVAL }}
            OPENWEATHERMAP_KEY=${{ secrets.OPENWEATHERMAP_KEY }}
            SPOTIFY_CLIENT=${{ vars.SPOTIFY_CLIENT }}
            SPOTIFY_SECRET=${{ secrets.SPOTIFY_SECRET }}
